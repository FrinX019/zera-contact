<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Contact information for Yashrajsinh Bihola, President and Fire Alarm Technician at Zera Fire Protection."

    <title>Yashrajsinh Bihola | Zera Fire Protection</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f2f4f7;
            font-family: Arial, Helvetica, sans-serif;
            color: #1c1c1c;
        }

        .contact-card {
            width: 100%;
            max-width: 430px;
            padding: 36px 24px;
            background: #ffffff;
            border-radius: 22px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        .company-name {
            margin-bottom: 24px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 30px;
        }

        .job-title {
            margin: 0 0 6px;
            color: #4d4d4d;
            font-size: 17px;
            line-height: 1.5;
        }

        .company {
            margin: 0 0 28px;
            font-weight: 700;
        }

        .primary-button,
        .secondary-button {
            display: block;
            width: 100%;
            margin-top: 12px;
            padding: 15px 18px;
            border-radius: 11px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 700;
        }

        .primary-button {
            background: #111111;
            color: #ffffff;
        }

        .secondary-button {
            border: 1px solid #d7d7d7;
            background: #ffffff;
            color: #111111;
        }

        .primary-button:active,
        .secondary-button:active {
            transform: scale(0.98);
        }

        .note {
            margin: 22px 0 0;
            color: #707070;
            font-size: 13px;
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <main class="contact-card">
        <div class="company-name">Zera Fire Protection</div>

        <h1>Yashrajsinh Bihola</h1>

        <p class="job-title">

        </p>

        <p class="company">Zera Fire Protection</p>

        <a
            class="primary-button"
            href="./yashrajsinh-bihola.vcf"
            download
        >
            Save Contact
        </a>

        <a
            class="secondary-button"
            href="tel:+16473253079"
        >
            Call 647-325-3079
        </a>

        <a
            class="secondary-button"
            href="tel:+14378988866"
        >
            Call 437-898-8866
        </a>

        <a
            class="secondary-button"

        <a
            class="secondary-button"

        <p class="note">
